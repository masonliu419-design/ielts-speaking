<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>IELTS Speaking 6.5 学习系统</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    "Noto Sans SC",
    sans-serif;
  background:#f3f6fb;
  color:#172033;
  line-height:1.65;
}

header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  padding:25px 16px 20px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:5px 0 15px;
  opacity:.9;
  font-size:14px;
}

nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:2px;
}

nav button{
  border:0;
  border-radius:20px;
  padding:9px 15px;
  background:rgba(255,255,255,.15);
  color:white;
  white-space:nowrap;
  cursor:pointer;
  font-size:14px;
}

nav button.active,
nav button:hover{
  background:white;
  color:#2563eb;
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 60px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  background:white;
  border-radius:18px;
  padding:25px 20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(15,23,42,.06);
}

.hero h2{
  margin:0 0 8px;
  color:#1e40af;
}

.hero p{
  margin:5px 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

.stat{
  background:#eff6ff;
  border-radius:14px;
  padding:15px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:26px;
  color:#2563eb;
}

.search-box{
  margin:15px 0;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border:1px solid #d6dce8;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.topic-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.topic-btn{
  border:0;
  background:white;
  padding:16px 13px;
  border-radius:15px;
  text-align:left;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(15,23,42,.06);
  transition:.2s;
}

.topic-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(15,23,42,.1);
}

.topic-number{
  color:#2563eb;
  font-size:12px;
  font-weight:bold;
}

.topic-name{
  display:block;
  font-weight:700;
  margin-top:4px;
}

.topic-count{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-top:5px;
}

.question-card{
  background:white;
  border-radius:17px;
  padding:19px;
  margin-bottom:15px;
  box-shadow:0 3px 15px rgba(15,23,42,.06);
}

.question-title{
  font-size:17px;
  font-weight:700;
  color:#172033;
}

.question-number{
  color:#2563eb;
  font-size:13px;
  font-weight:bold;
  margin-bottom:4px;
}

.answer{
  margin-top:13px;
  background:#f8fafc;
  border-left:4px solid #2563eb;
  padding:13px 14px;
  border-radius:8px;
}

.answer-label{
  color:#2563eb;
  font-weight:bold;
  font-size:13px;
}

.translation{
  margin-top:12px;
  background:#fff7ed;
  border-left:4px solid #f97316;
  padding:12px 14px;
  border-radius:8px;
}

.translation-label{
  color:#ea580c;
  font-weight:bold;
  font-size:13px;
}

.vocab{
  margin-top:12px;
}

.tag{
  display:inline-block;
  background:#eef2ff;
  color:#4338ca;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  margin:3px 3px 3px 0;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:8px 11px;
  cursor:pointer;
  font-size:13px;
  background:#e8eef9;
  color:#1e3a8a;
}

.btn:hover{
  opacity:.85;
}

.btn.primary{
  background:#2563eb;
  color:white;
}

.btn.success{
  background:#16a34a;
  color:white;
}

.btn.favorite{
  background:#fef3c7;
  color:#92400e;
}

.topic-header{
  background:white;
  border-radius:17px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 15px rgba(15,23,42,.06);
}

.back-btn{
  border:0;
  background:#eef2ff;
  color:#3730a3;
  border-radius:9px;
  padding:8px 12px;
  cursor:pointer;
  margin-bottom:12px;
}

.topic-header h2{
  margin:0;
  color:#1e40af;
}

.practice-card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 18px rgba(15,23,42,.07);
}

.practice-question{
  font-size:21px;
  font-weight:700;
  margin:12px 0 18px;
}

.practice-answer{
  background:#f8fafc;
  padding:16px;
  border-radius:12px;
  margin-top:15px;
}

.hidden{
  display:none;
}

.empty{
  background:white;
  border-radius:16px;
  padding:30px 20px;
  text-align:center;
  color:#64748b;
}

.progress-wrap{
  margin-top:15px;
}

.progress-bar{
  height:10px;
  background:#e2e8f0;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar span{
  display:block;
  height:100%;
  background:#2563eb;
  border-radius:20px;
  width:0%;
  transition:.3s;
}

footer{
  text-align:center;
  color:#64748b;
  padding:30px 15px;
  font-size:13px;
}

@media(max-width:700px){
  .topic-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  header h1{
    font-size:23px;
  }

  .practice-question{
    font-size:19px;
  }
}

@media(max-width:420px){
  .topic-grid{
    grid-template-columns:1fr;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:10px 5px;
  }

  .stat strong{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>IELTS Speaking 6.5</h1>
    <p>雅思口语 6.5 原创学习系统</p>

    <nav>
      <button class="active" onclick="showPage('home',this)">首页</button>
      <button onclick="showPage('part1',this)">Part 1</button>
      <button onclick="showPage('practice',this)">随机练习</button>
      <button onclick="showPage('favorites',this)">我的收藏</button>
    </nav>
  </div>
</header>

<main>

<section id="home" class="page active">

  <div class="hero">
    <h2>IELTS Speaking 6.5</h2>

    <p>
      以自然、清晰、容易记忆的方式练习雅思口语。
    </p>

    <p>
      <strong>6.5 答题思路：</strong>
      先回答问题 → 给一个原因 → 加一个具体细节。
    </p>

    <div class="stats">
      <div class="stat">
        <strong id="totalCount">141</strong>
        <span>题目</span>
      </div>

      <div class="stat">
        <strong id="doneCount">0</strong>
        <span>已完成</span>
      </div>

      <div class="stat">
        <strong id="favoriteCount">0</strong>
        <span>收藏</span>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <span id="progressBar"></span>
      </div>
    </div>
  </div>

  <div class="hero">
    <h2>Part 1</h2>

    <p>
      共 47 个话题，每个话题 3 道原创练习。
    </p>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="搜索话题或题目……"
        oninput="renderTopics(this.value)"
      >
    </div>

    <div id="topicGrid" class="topic-grid"></div>
  </div>

</section>

<section id="part1" class="page">

  <div id="topicContent"></div>

</section>

<section id="practice" class="page">

  <div class="hero">
    <h2>随机口语练习</h2>
    <p>随机抽取一道 Part 1 题目进行练习。</p>
  </div>

  <div class="practice-card">

    <div id="practiceTopic"></div>

    <div id="practiceQuestion" class="practice-question">
      点击下面按钮开始练习
    </div>

    <div class="actions">
      <button class="btn primary" onclick="newPracticeQuestion()">
        🎲 随机题目
      </button>

      <button class="btn" onclick="listenPracticeQuestion()">
        🔊 听题目
      </button>

      <button class="btn success" onclick="showPracticeAnswer()">
        查看参考答案
      </button>

      <button class="btn" onclick="stopSpeech()">
        ⏹ 停止朗读
      </button>
    </div>

    <div id="practiceAnswer" class="practice-answer hidden"></div>

  </div>

</section>

<section id="favorites" class="page">

  <div class="hero">
    <h2>我的收藏</h2>
    <p>你收藏的题目会保存在当前浏览器中。</p>
  </div>

  <div id="favoriteList"></div>

</section>

</main>

<footer>
  IELTS Speaking 6.5 原创学习系统
</footer>

<script>const data = [

{
topic:"Study or Work",

]
},

]
},

{

{
topic:"The Area You Live In",

  /* =========================
   APP LOGIC
========================= */

let allQuestions = [];
let currentTopicIndex = -1;
let currentPractice = null;

const DONE_KEY = "ielts65_done";
const FAV_KEY = "ielts65_favorites";

function loadSet(key){
  try{
    const value = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(value) ? value : [];
  }catch(e){
    return [];
  }
}

function saveSet(key, value){
  localStorage.setItem(key, JSON.stringify(value));
}

function questionId(topicIndex, questionIndex){
  return `${topicIndex}-${questionIndex}`;
}

function getDone(){
  return loadSet(DONE_KEY);
}

function getFav(){
  return loadSet(FAV_KEY);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showPage(pageId, navButton){
  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });

  const page = document.getElementById(pageId);

  if(page){
    page.classList.add("active");
  }

  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.remove("active");
  });

  if(navButton){
    navButton.classList.add("active");
  }else{
    const map = {
      home:0,
      part1:1,
      practice:2,
      favorites:3
    };

    const buttons = document.querySelectorAll("nav button");

    if(buttons[map[pageId]]){
      buttons[map[pageId]].classList.add("active");
    }
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(pageId === "favorites"){
    renderFavorites();
  }

  if(pageId === "practice" && !currentPractice){
    newPracticeQuestion();
  }
}

function renderTopics(){
  const grid = document.getElementById("topicGrid");
  const input = document.getElementById("topicSearch");

  if(!grid) return;

  const keyword = (input?.value || "")
    .trim()
    .toLowerCase();

  grid.innerHTML = "";

  data.forEach((item,index)=>{

    const text =
      `${item.topic} ${item.cn}`.toLowerCase();

    if(keyword && !text.includes(keyword)){
      return;
    }

    const button = document.createElement("button");

    button.className = "topic-btn";
    button.type = "button";

    button.innerHTML = `
      <span class="topic-number">
        TOPIC ${index+1}
      </span>

      <span class="topic-name">
        ${escapeHtml(item.topic)}
      </span>

      <span class="topic-count">
        ${escapeHtml(item.cn)} ·
        ${item.questions.length} 道题
      </span>
    `;

    button.addEventListener("click",()=>{
      openTopic(index);
    });

    grid.appendChild(button);
  });

  if(!grid.children.length){
    grid.innerHTML = `
      <div class="empty"
           style="grid-column:1/-1">
        没有找到相关话题。
      </div>
    `;
  }
}

function openTopic(index){

  currentTopicIndex = index;

  const item = data[index];

  if(!item) return;

  const title =
    document.getElementById("topicTitle");

  const description =
    document.getElementById("topicDescription");

  if(title){
    title.textContent =
      `${index+1}. ${item.topic} · ${item.cn}`;
  }

  if(description){
    description.textContent =
      `共 ${item.questions.length} 道原创练习。建议先自己回答，再参考答案和词汇。`;
  }

  renderQuestions(index);

  showPage("part1");
}

function renderQuestions(topicIndex){

  const container =
    document.getElementById("questionsContainer");

  const item = data[topicIndex];

  if(!container || !item) return;

  const done = getDone();
  const fav = getFav();

  container.innerHTML =
    item.questions.map((q,i)=>{

      const id =
        questionId(topicIndex,i);

      const isDone =
        done.includes(id);

      const isFav =
        fav.includes(id);

      const vocab =
        (q.v || [])
        .map(v =>
          `<span class="tag">
            ${escapeHtml(v)}
           </span>`
        )
        .join("");

      return `
        <article
          class="question-card ${isDone ? "completed" : ""}"
          id="question-${id}">

          <div class="question-number">
            Question ${i+1}
          </div>

          <div class="question-title">
            ${escapeHtml(q.q)}
          </div>

          <div class="answer">

            <div class="answer-label">
              ⭐ Band 6.5 参考答案
            </div>

            <div>
              ${escapeHtml(q.a)}
            </div>

          </div>

          <div class="translation">

            <div class="translation-label">
              🇨🇳 中文理解
            </div>

            <div>
              ${escapeHtml(q.c)}
            </div>

          </div>

          <div class="vocab">
            ${vocab}
          </div>

          <div class="actions">

            <button
              class="btn btn-blue"
              type="button"
              onclick="speakAnswer(${topicIndex},${i})">

              🔊 播放答案

            </button>

            <button
              class="btn ${isDone ? "btn-gray" : "btn-green"}"
              type="button"
              onclick="toggleDone(${topicIndex},${i})">

              ${isDone ? "✓ 已完成" : "✓ 完成"}

            </button>

            <button
              class="btn ${isFav ? "btn-yellow" : "btn-gray"}"
              type="button"
              onclick="toggleFavorite(${topicIndex},${i})">

              ${isFav ? "❤️ 已收藏" : "🤍 收藏"}

            </button>

            <button
              class="btn btn-red"
              type="button"
              onclick="stopSpeech()">

              ⏹ 停止

            </button>

          </div>

        </article>
      `;

    }).join("");
}

function toggleDone(topicIndex,questionIndex){

  const id =
    questionId(topicIndex,questionIndex);

  const done = getDone();

  const pos =
    done.indexOf(id);

  if(pos >= 0){
    done.splice(pos,1);
  }else{
    done.push(id);
  }

  saveSet(DONE_KEY,done);

  updateStats();

  if(currentTopicIndex >= 0){
    renderQuestions(currentTopicIndex);
  }

  renderFavorites();
}

function toggleFavorite(topicIndex,questionIndex){

  const id =
    questionId(topicIndex,questionIndex);

  const fav = getFav();

  const pos =
    fav.indexOf(id);

  if(pos >= 0){
    fav.splice(pos,1);
  }else{
    fav.push(id);
  }

  saveSet(FAV_KEY,fav);

  updateStats();

  if(currentTopicIndex >= 0){
    renderQuestions(currentTopicIndex);
  }

  renderFavorites();
}

function updateStats(){

  const total =
    allQuestions.length;

  const done =
    getDone().length;

  const fav =
    getFav().length;

  const totalEl =
    document.getElementById("totalCount");

  const doneEl =
    document.getElementById("doneCount");

  const favEl =
    document.getElementById("favCount");

  const progress =
    document.getElementById("mainProgress");

  if(totalEl){
    totalEl.textContent = total;
  }

  if(doneEl){
    doneEl.textContent = done;
  }

  if(favEl){
    favEl.textContent = fav;
  }

  if(progress){

    progress.style.width =
      total
      ? `${Math.min(100,done/total*100)}%`
      : "0%";

  }
}

function renderFavorites(){

  const container =
    document.getElementById("favoriteContainer");

  if(!container) return;

  const fav =
    getFav();

  if(!fav.length){

    container.innerHTML = `
      <div class="empty">

        还没有收藏题目。

        <br>

        去 Part 1 点击“🤍 收藏”即可。

      </div>
    `;

    return;
  }

  const cards = [];

  fav.forEach(id=>{

    const [ti,qi] =
      id.split("-").map(Number);

    const item =
      data[ti];

    const q =
      item?.questions?.[qi];

    if(!item || !q) return;

    cards.push(`

      <article class="question-card">

        <div class="question-number">

          ${escapeHtml(item.topic)}
          · Question ${qi+1}

        </div>

        <div class="question-title">

          ${escapeHtml(q.q)}

        </div>

        <div class="answer">

          <div class="answer-label">
            ⭐ Band 6.5 参考答案
          </div>

          <div>
            ${escapeHtml(q.a)}
          </div>

        </div>

        <div class="translation">

          <div class="translation-label">
            🇨🇳 中文理解
          </div>

          <div>
            ${escapeHtml(q.c)}
          </div>

        </div>

        <div class="actions">

          <button
            class="btn btn-blue"
            type="button"
            onclick="speakAnswer(${ti},${qi})">

            🔊 播放答案

          </button>

          <button
            class="btn btn-yellow"
            type="button"
            onclick="toggleFavorite(${ti},${qi})">

            ❤️ 取消收藏

          </button>

          <button
            class="btn btn-gray"
            type="button"
            onclick="openTopic(${ti})">

            📚 打开话题

          </button>

        </div>

      </article>

    `);

  });

  container.innerHTML =
    cards.length
    ? cards.join("")
    : `<div class="empty">
         收藏记录中没有可显示的题目。
       </div>`;
}

function buildQuestionList(){

  allQuestions = [];

  data.forEach((topic,ti)=>{

    topic.questions.forEach((q,qi)=>{

      allQuestions.push({

        topic,

        topicIndex:ti,

        questionIndex:qi,

        question:q

      });

    });

  });
}

function newPracticeQuestion(){

  if(!allQuestions.length){
    return;
  }

  const random =
    allQuestions[
      Math.floor(
        Math.random()*allQuestions.length
      )
    ];

  currentPractice = random;

  const topic =
    document.getElementById("practiceTopic");

  const question =
    document.getElementById("practiceQuestion");

  const input =
    document.getElementById("practiceInput");

  const answer =
    document.getElementById("practiceAnswer");

  if(topic){

    topic.textContent =
      `${random.topicIndex+1}. ${random.topic.topic} · ${random.topic.cn}`;

  }

  if(question){

    question.textContent =
      random.question.q;

  }

  if(input){

    input.value = "";

  }

  if(answer){

    answer.innerHTML = "";

  }
}

function showPracticeAnswer(){

  if(!currentPractice){
    newPracticeQuestion();
  }

  if(!currentPractice){
    return;
  }

  const q =
    currentPractice.question;

  const answer =
    document.getElementById("practiceAnswer");

  if(!answer) return;

  answer.innerHTML = `

    <div class="answer">

      <div class="answer-label">
        ⭐ Band 6.5 参考答案
      </div>

      <div>
        ${escapeHtml(q.a)}
      </div>

    </div>

    <div class="translation">

      <div class="translation-label">
        🇨🇳 中文理解
      </div>

      <div>
        ${escapeHtml(q.c)}
      </div>

    </div>

    <div class="vocab">

      ${(q.v || [])
        .map(v =>
          `<span class="tag">
            ${escapeHtml(v)}
           </span>`
        )
        .join("")}

    </div>

  `;
}

function getEnglishVoice(){

  if(!("speechSynthesis" in window)){
    return null;
  }

  const voices =
    window.speechSynthesis.getVoices();

  return (

    voices.find(
      v => /^en-US$/i.test(v.lang)
    )

    ||

    voices.find(
      v => /^en-GB$/i.test(v.lang)
    )

    ||

    voices.find(
      v => /^en/i.test(v.lang)
    )

    ||

    null

  );
}

function speakText(text){

  if(!("speechSynthesis" in window)){

    alert(
      "当前浏览器不支持语音播放。"
    );

    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    "en-US";

  utterance.rate =
    0.88;

  utterance.pitch =
    1;

  const voice =
    getEnglishVoice();

  if(voice){
    utterance.voice = voice;
  }

  setTimeout(()=>{

    window.speechSynthesis.speak(
      utterance
    );

  },80);
}

function speakAnswer(topicIndex,questionIndex){

  const q =
    data[topicIndex]?.questions?.[questionIndex];

  if(q){
    speakText(q.a);
  }
}

function listenPracticeQuestion(){

  if(currentPractice){

    speakText(
      currentPractice.question.q
    );

  }else{

    newPracticeQuestion();

    if(currentPractice){

      speakText(
        currentPractice.question.q
      );

    }

  }
}

function stopSpeech(){

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

  }
}

if("speechSynthesis" in window){

  window.speechSynthesis.onvoiceschanged =
    ()=>{};

}

function init(){

  buildQuestionList();

  renderTopics();

  updateStats();

  renderFavorites();

  document
    .querySelectorAll(".page")
    .forEach(p=>{
      p.classList.remove("active");
    });

  const home =
    document.getElementById("home");

  if(home){
    home.classList.add("active");
  }
}

document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
